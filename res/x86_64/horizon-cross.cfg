[binaries]
c = '@GLOBAL_SOURCE_ROOT@/deps/llvm/build/bin/clang'
cpp = '@GLOBAL_SOURCE_ROOT@/deps/llvm/build/bin/clang++'
as = '@GLOBAL_SOURCE_ROOT@/deps/llvm/build/bin/clang'
ar = '@GLOBAL_SOURCE_ROOT@/deps/llvm/build/bin/llvm-ar'
ld = '@GLOBAL_SOURCE_ROOT@/deps/llvm/build/bin/ld.lld'
objcopy = '@GLOBAL_SOURCE_ROOT@/deps/llvm/build/bin/llvm-objcopy'
windres = '@GLOBAL_SOURCE_ROOT@/deps/llvm/build/bin/llvm-windres'
strip = '@GLOBAL_SOURCE_ROOT@/deps/llvm/build/bin/llvm-strip'

[host_machine]
system = 'linux'
kernel = 'none'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
