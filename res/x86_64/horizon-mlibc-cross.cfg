[binaries]
c = '@GLOBAL_SOURCE_ROOT@/../../toolchain/bin/clang'
c_ld = '@GLOBAL_SOURCE_ROOT@/../../toolchain/bin/ld.lld'
cpp = '@GLOBAL_SOURCE_ROOT@/../../toolchain/bin/clang++'
cpp_ld = '@GLOBAL_SOURCE_ROOT@/../../toolchain/bin/ld.lld'
as = '@GLOBAL_SOURCE_ROOT@/../../toolchain/bin/clang'
as_ld = '@GLOBAL_SOURCE_ROOT@/../../toolchain/bin/ld.lld'
ar = '@GLOBAL_SOURCE_ROOT@/../../toolchain/bin/llvm-ar'
objcopy = '@GLOBAL_SOURCE_ROOT@/../../toolchain/bin/llvm-objcopy'
windres = '@GLOBAL_SOURCE_ROOT@/../../toolchain/bin/llvm-windres'
strip = '@GLOBAL_SOURCE_ROOT@/../../toolchain/bin/llvm-strip'

[host_machine]
system = 'horizonos'
kernel = 'none'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
