name: Setup Deps

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

jobs:
  build-llvm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Restore Deps Folder
        id: cache-deps-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{github.workspace}}/deps/chdrs
            ${{github.workspace}}/deps/cxxhdrs
            ${{github.workspace}}/deps/flanterm
            ${{github.workspace}}/deps/limine
            ${{github.workspace}}/deps/llvm
            ${{github.workspace}}/deps/nanoprintf
            ${{github.workspace}}/deps/ovmf
            ${{github.workspace}}/deps/uacpi
          key: ${{runner.os}}-horizonos-deps

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install meson==1.9.1 ninja

      - name: Setup Meson
        run: cd ${{github.workspace}} && meson setup -Dbuild_llvm=true build

      - name: Upload LLVM
        id: upload-llvm
        uses: actions/upload-artifact@v5
        with:
          name: HorizonOS LLVM
          path: ${{github.workspace}}/deps/llvm
          if-no-files-found: 'warn'
          retention-days: 1
          compression-level: '9'
          overwrite: 'false'
          include-hidden-files: 'false'

      - name: Save Deps Folder
        id: cache-deps-save
        uses: actions/cache/save@v4
        with:
          path: |
            ${{github.workspace}}/deps/chdrs
            ${{github.workspace}}/deps/cxxhdrs
            ${{github.workspace}}/deps/flanterm
            ${{github.workspace}}/deps/limine
            ${{github.workspace}}/deps/llvm
            ${{github.workspace}}/deps/nanoprintf
            ${{github.workspace}}/deps/ovmf
            ${{github.workspace}}/deps/uacpi
          key: ${{steps.cache-deps-restore.outputs.cache-primary-key}}
