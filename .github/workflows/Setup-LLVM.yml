name: Setup LLVM

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

jobs:
  build-llvm:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - uses: hendrikmuhs/ccache-action@v1.2

      - name: Restore Deps Folder
        id: cache-deps-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{github.workspace}}/deps/llvm/build
          key: ${{runner.os}}-horizonos-llvm



      - name: Setup Meson
        run: cd ${{github.workspace}} && meson setup -Dbuild_llvm=true -Dqemu_targets=false build

      - name: Upload LLVM
        id: upload-llvm
        uses: actions/upload-artifact@v5
        with:
          name: HorizonOS LLVM Build
          path: ${{github.workspace}}/deps/llvm/build
          if-no-files-found: 'warn'
          retention-days: 1
          compression-level: '9'
          overwrite: 'false'
          include-hidden-files: 'false'

      - name: Save Deps Folder
        id: cache-deps-save
        uses: actions/cache/save@v4
        with:
          path: ${{github.workspace}}/deps/llvm/build
          key: ${{steps.cache-deps-restore.outputs.cache-primary-key}}
