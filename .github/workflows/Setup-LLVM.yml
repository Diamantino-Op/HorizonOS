name: Setup Toolchain and Libs

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

jobs:
  build-llvm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - uses: hendrikmuhs/ccache-action@v1.2

      - name: Restore Toolchain Build
        id: cache-toolchain-build-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{github.workspace}}/deps/llvm/build
          key: ${{runner.os}}-horizonos-toolchain-build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install meson ninja

      - name: Install xorriso
        run: sudo apt-get install xorriso

      - name: Install CMake
        run: sudo apt-get install cmake

      - name: Install RSync
        run: sudo apt-get install rsync

      - name: Setup LLVM
        run: cd ${{github.workspace}} && meson setup -Dqemu_targets=false build-deps && cd build-deps && meson compile setup_llvm

      - name: Setup Meson
        run: cd ${{github.workspace}} && meson setup -Dbuild_llvm=true -Dqemu_targets=false build

      - name: Upload Toolchain
        id: upload-toolchain
        uses: actions/upload-artifact@v6
        with:
          name: HorizonOS LLVM Build
          path: ${{github.workspace}}/toolchain
          if-no-files-found: 'warn'
          retention-days: 1
          compression-level: '9'
          overwrite: 'false'
          include-hidden-files: 'false'

      - name: Save Toolchain Build
        id: cache-toolchain-build-save
        uses: actions/cache/save@v5
        with:
          path: ${{github.workspace}}/deps/llvm/build
          key: ${{runner.os}}-horizonos-toolchain-build

      - name: Save Toolchain
        id: cache-toolchain-save
        uses: actions/cache/save@v5
        with:
          path: ${{github.workspace}}/toolchain
          key: ${{runner.os}}-horizonos-toolchain

  build-libc-x86_64:
    runs-on: ubuntu-latest
    needs: build-llvm

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - uses: hendrikmuhs/ccache-action@v1.2

      - name: Restore Toolchain
        id: cache-toolchain-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{github.workspace}}/toolchain
          key: ${{runner.os}}-horizonos-toolchain

      - name: Restore Sysroot Build
        id: cache-sys-build-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{github.workspace}}/deps/llvm/build-cxx
            ${{github.workspace}}/deps/llvm/build-rt-builtins
          key: ${{runner.os}}-horizonos-x86_64-sys-build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install meson ninja

      - name: Install xorriso
        run: sudo apt-get install xorriso

      - name: Install CMake
        run: sudo apt-get install cmake

      - name: Install RSync
        run: sudo apt-get install rsync

      - name: Setup MLibc
        run: cd ${{github.workspace}} && meson setup --cross-file res/x86_64/horizon-cross.cfg -Dqemu_targets=false build-deps && cd build-deps && meson compile setup_mlibc && meson compile setup_llvm

      - name: Setup Meson
        run: cd ${{github.workspace}} && meson setup --cross-file res/x86_64/horizon-cross.cfg -Dbuild_libc=true -Dqemu_targets=false build

      - name: Upload Sysroot
        id: upload-sysroot
        uses: actions/upload-artifact@v6
        with:
          name: HorizonOS Sysroot x86_64
          path: ${{github.workspace}}/sysroot
          if-no-files-found: 'warn'
          retention-days: 1
          compression-level: '9'
          overwrite: 'false'
          include-hidden-files: 'false'

      - name: Save Sysroot Build
        id: cache-sys-build-save
        uses: actions/cache/save@v5
        with:
          path: |
            ${{github.workspace}}/deps/llvm/build-cxx
            ${{github.workspace}}/deps/llvm/build-rt-builtins
          key: ${{runner.os}}-horizonos-x86_64-sys-build

      - name: Save Sysroot
        id: cache-sysroot-save
        uses: actions/cache/save@v5
        with:
          path: ${{github.workspace}}/libs/sysroot
          key: ${{runner.os}}-horizonos-x86_64-sysroot

