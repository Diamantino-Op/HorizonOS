name: Setup LLVM

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

jobs:
  build-llvm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Check for LLVM submodule changes
        id: check-changes
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          
          if git diff --name-only $BASE_SHA ${{ github.sha }} | grep -q "^deps/llvm-patches"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - uses: hendrikmuhs/ccache-action@v1.2
        if: steps.check-changes.outputs.changed == 'true'

      - name: Restore Deps Folder
        id: cache-deps-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{github.workspace}}/deps/llvm/build
          key: ${{runner.os}}-horizonos-llvm

      - name: Set up Python
        if: steps.check-changes.outputs.changed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        if: steps.check-changes.outputs.changed == 'true'
        run: python -m pip install meson==1.9.1 ninja

      - name: Install xorriso
        if: steps.check-changes.outputs.changed == 'true'
        run: sudo apt-get install xorriso

      - name: Install CMake
        if: steps.check-changes.outputs.changed == 'true'
        run: sudo apt-get install cmake

      - name: Setup Meson
        if: steps.check-changes.outputs.changed == 'true'
        run: cd ${{github.workspace}} && meson setup -Dbuild_llvm=true -Dqemu_targets=false build

      - name: Upload LLVM
        id: upload-llvm
        uses: actions/upload-artifact@v5
        with:
          name: HorizonOS LLVM Build
          path: ${{github.workspace}}/deps/llvm/build
          if-no-files-found: 'warn'
          retention-days: 1
          compression-level: '9'
          overwrite: 'false'
          include-hidden-files: 'false'

      - name: Save Deps Folder
        id: cache-deps-save
        uses: actions/cache/save@v4
        with:
          path: ${{github.workspace}}/deps/llvm/build
          key: ${{steps.cache-deps-restore.outputs.cache-primary-key}}
